<style>
:root{--bg:#0f1115;--card:#181b22;--tx:#f2f4f8;--mu:#9aa3b2;--bd:#262b35;--ac:#4ade80;--acx:#06220f;--r:22px;--bl:0px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f4f6fa;--card:#fff;--tx:#14171d;--mu:#5d6676;--bd:#e2e6ee}
:root[data-theme="amoled"]{--bg:#000;--card:#0c0c0f;--tx:#f2f4f8;--mu:#8b93a1;--bd:#1c1e24}
:root[data-theme="midnight"]{--bg:#0a1020;--card:#111a30;--tx:#eaf0ff;--mu:#93a1c0;--bd:#1f2c4a}
:root[data-theme="forest"]{--bg:#0d1410;--card:#141e18;--tx:#eef6f0;--mu:#97aa9d;--bd:#223027}
:root[data-theme="sand"]{--bg:#f6f1e7;--card:#fffaf0;--tx:#2a2418;--mu:#7a6e58;--bd:#e5dcc7}
:root[data-theme="glass"]{--bg:#0b0d14;--card:rgba(255,255,255,.08);--tx:#fff;--mu:#c3c9d6;--bd:rgba(255,255,255,.18);--bl:22px}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;transition:background .3s,color .3s}
[data-theme="glass"] body{background:radial-gradient(600px 400px at 15% 10%,var(--ac),transparent 60%),radial-gradient(700px 500px at 90% 80%,#7c5cff,transparent 60%),#0b0d14}
.wrap{max-width:1000px;margin:0 auto;padding:16px 20px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:var(--tx);text-decoration:none}
.mono{width:40px;height:40px;border-radius:14px;background:var(--ac);color:var(--acx);display:grid;place-items:center;font-weight:900;font-size:16px}
.card,.pill{background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(var(--bl));-webkit-backdrop-filter:blur(var(--bl))}
.card{border-radius:var(--r);padding:22px}
.pill{border-radius:999px;padding:6px;display:flex;gap:4px;align-items:center}
.pill button,.pill select{border:0;border-radius:999px;background:transparent;color:var(--tx);font:inherit;font-size:14px;padding:7px 14px;cursor:pointer}
.pill button.on{background:var(--ac);color:var(--acx);font-weight:700}
.pill select{background:transparent;padding:7px 10px}
.pill a{border-radius:999px;color:var(--tx);text-decoration:none;font-size:14px;padding:8px 16px}
.pill a.on{background:var(--ac);color:var(--acx);font-weight:700}
.sw.tsw{border-color:rgba(128,128,128,.55)!important}.sw.tsw.on{border-color:var(--tx)!important}
.pill select option{color:#000}
.sw{width:22px;height:22px;border-radius:50%!important;padding:0!important;border:2px solid transparent!important}
.sw.on{border-color:var(--tx)!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:14px 28px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.p{background:var(--ac);color:var(--acx)}
.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.hero{text-align:center;padding:64px 0 36px}
.hero h1{font-size:clamp(34px,7vw,64px);line-height:1.05;margin:0 0 16px;letter-spacing:-.02em}
.hero p{color:var(--mu);max-width:560px;margin:0 auto 28px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:30px 0}
.ic{width:44px;height:44px;border-radius:16px;background:var(--ac);color:var(--acx);display:grid;place-items:center;font-size:20px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:17px}.card p{margin:0;color:var(--mu);font-size:14px}
.mock{border-radius:28px;padding:14px;margin:20px 0}
.win{display:grid;grid-template-columns:70px 1fr;gap:12px;min-height:200px}
.side{display:flex;flex-direction:column;gap:10px;align-items:center;padding:8px 0}
.side i{width:40px;height:40px;border-radius:14px;background:var(--bd)}.side i:first-child{background:var(--ac)}
.main{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.main i{border-radius:18px;background:var(--bd);min-height:80px}
.dl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0 40px}
.login{max-width:420px;margin:60px auto;text-align:center}
.login h2{margin:0 0 20px}.login .btn{width:100%;margin-bottom:12px}
.note{color:var(--mu);font-size:13px;margin-top:10px}
footer{text-align:center;color:var(--mu);font-size:13px;padding:30px 0}
.hide{display:none}.doc{max-width:720px;margin:40px auto}.doc h3{margin:22px 0 6px;font-size:17px}.doc p,.doc li{color:var(--mu)}.doc ul{padding-left:20px}
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pc{display:flex;gap:12px;padding:14px;cursor:pointer;text-align:left}
.pc img,.mi{width:56px;height:56px;border-radius:16px;object-fit:cover;background:var(--bd);flex:none}
.pc p{margin:2px 0;color:var(--mu);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc small,.vr small{color:var(--mu)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:40px 16px}
.modal.hide{display:none}.mbox{max-width:720px;width:100%}
.mbox a:not(.btn){color:var(--ac)}
.off{opacity:.45;filter:grayscale(1)}.vr.off .btn{pointer-events:none;background:var(--bd);color:var(--mu)}
.sec{margin:34px 0 6px;font-size:22px}.sel{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.vr{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}

:root[data-theme="cold"]{--bg:#0a1626;--card:rgba(20,38,64,.8);--tx:#eaf4ff;--mu:#9fb6d3;--bd:#27456b}
:root[data-theme="warm"]{--bg:#fff3dc;--card:rgba(255,252,244,.86);--tx:#3a2410;--mu:#8a6a48;--bd:#f0d9ae}
:root[data-theme="autumn"]{--bg:#1d120b;--card:rgba(48,29,17,.82);--tx:#fbeee0;--mu:#c3a283;--bd:#4d3220}
:root[data-theme="spring"]{--bg:#0b1a1c;--card:rgba(18,42,44,.82);--tx:#e9fbf6;--mu:#93bdb5;--bd:#245054}
[data-theme="cold"] body{background:linear-gradient(#0a1626,#143058) fixed}
[data-theme="warm"] body{background:linear-gradient(#fff3dc,#ffe0a8) fixed}
[data-theme="autumn"] body{background:linear-gradient(#1d120b,#3a2010) fixed}
[data-theme="spring"] body{background:linear-gradient(#0b1a1c,#123a40) fixed}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1}
#hue{-webkit-appearance:none;appearance:none;width:200px;height:10px;border-radius:99px;margin:0 8px;background:linear-gradient(90deg,hsl(0 85% 58%),hsl(60 85% 58%),hsl(120 85% 58%),hsl(180 85% 58%),hsl(240 85% 58%),hsl(300 85% 58%),hsl(360 85% 58%))}
#hue::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--bd);cursor:pointer}
#hue::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--bd);cursor:pointer}
.dock{position:fixed;left:18px;top:110px;width:250px;display:none;flex-direction:column;gap:12px;z-index:2;max-height:calc(100vh - 130px);overflow:auto;padding:4px;scrollbar-width:none}
@media(min-width:1560px){.dock.on{display:flex}}
.dk{padding:12px;cursor:pointer;animation:drop .9s cubic-bezier(.3,1.4,.5,1) both;transition:transform .2s}
.dk:hover{transform:translateY(-3px) scale(1.02)}
.dk .t{font-size:11px;color:var(--ac);font-weight:800;text-transform:uppercase;margin-bottom:6px}
.dk .row{display:flex;gap:10px;align-items:center}.dk .mi{width:44px;height:44px;border-radius:12px}
.dk p{margin:8px 0;font-size:13px;color:var(--mu);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dk .btn{width:100%;padding:7px 14px;font-size:13px}
@keyframes drop{from{transform:translateY(-140px) rotate(-5deg);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.dk{animation:none}}
.rain{position:fixed;right:18px;top:0;bottom:0;width:250px;overflow:hidden;pointer-events:none;z-index:2;display:none}
@media(min-width:1560px){.rain.on{display:block}}
.rc{position:absolute;top:0;left:0;width:230px;padding:10px 12px;cursor:pointer;pointer-events:auto;animation:fall linear infinite;will-change:transform}
.rc .row{display:flex;gap:10px;align-items:center}.rc .mi{width:40px;height:40px;border-radius:11px}
.rc .t{font-size:10px;color:var(--ac);font-weight:800;text-transform:uppercase}
.rc b{display:block;font-size:14px;line-height:1.2}
.rc p{margin:2px 0 0;font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.rc:hover{border-color:var(--ac)}
.rain:has(.rc:hover) .rc{animation-play-state:paused}
@keyframes fall{from{transform:translate(var(--x),-130px) rotate(var(--r))}to{transform:translate(var(--x),calc(100vh + 20px)) rotate(var(--r))}}
@media(prefers-reduced-motion:reduce){.rain{display:none!important}}
</style>
</head>

en:{a:`<div class='card doc'><h2>About SA Launcher</h2><p>SA Launcher is an independent launcher for Minecraft: Java Edition, made by Simeon Alyushev (Poland). It is not an official Minecraft product and is not approved by or associated with Mojang or Microsoft.</p><h3>What it does</h3><ul><li>Downloads game files directly from Mojang’s official servers and never redistributes them.</li><li>Signs in licensed players with Microsoft and checks that the account owns Java Edition.</li><li>Offers Ely.by as a separate, clearly marked option for players without a license.</li><li>Manages instances and installs mods, shaders and packs from Modrinth.</li><li>Keeps Minecraft access tokens only on the player’s own device.</li></ul><h3>Microsoft permissions</h3><p>Only XboxLive.signin and offline_access, used solely to sign the player in and load their Minecraft profile.</p><h3>Contact</h3><p>${MAIL}</p></div>`,
p:`<div class='card doc'><h2>Privacy Policy</h2><p>Controller: Simeon Alyushev, Poland. Contact: ${MAIL}.</p><h3>Data we store</h3><ul><li>Your Microsoft or Ely.by account ID and display name.</li><li>Your settings (theme, accent colour, language) and the list of your cloud instances.</li></ul><h3>Data we never store</h3><ul><li>Passwords: sign-in happens on Microsoft’s or Ely.by’s own pages.</li><li>Minecraft, Xbox and XSTS tokens: they stay on your device.</li></ul><h3>Why</h3><p>To identify your SA profile and sync your settings and instances between devices.</p><h3>Third parties</h3><p>Microsoft and Ely.by (sign-in) and Modrinth (mod catalog) process data under their own policies. We use no advertising or tracking.</p><h3>Your rights</h3><p>You can access, correct or delete your data and your SA account at any time (GDPR). Write to ${MAIL}.</p></div>`},
ru:{a:`<div class='card doc'><h2>О SA Launcher</h2><p>SA Launcher — независимый лаунчер для Minecraft: Java Edition, создан Simeon Alyushev (Польша). Это не официальный продукт Minecraft, он не одобрен Mojang или Microsoft и не связан с ними.</p><h3>Что он делает</h3><ul><li>Скачивает файлы игры напрямую с официальных серверов Mojang и никогда не распространяет их сам.</li><li>Выполняет вход лицензионных игроков через Microsoft и проверяет наличие Java Edition.</li><li>Предлагает Ely.by как отдельный, явно обозначенный вариант для игроков без лицензии.</li><li>Управляет сборками и ставит моды, шейдеры и паки с Modrinth.</li><li>Хранит токены Minecraft только на устройстве игрока.</li></ul><h3>Права Microsoft</h3><p>Только XboxLive.signin и offline_access, исключительно для входа и загрузки профиля Minecraft.</p><h3>Контакты</h3><p>${MAIL}</p></div>`,
p:`<div class='card doc'><h2>Политика конфиденциальности</h2><p>Оператор данных: Simeon Alyushev, Польша. Контакт: ${MAIL}.</p><h3>Что мы храним</h3><ul><li>Идентификатор и отображаемое имя аккаунта Microsoft или Ely.by.</li><li>Настройки (тема, акцентный цвет, язык) и список ваших облачных сборок.</li></ul><h3>Что мы не храним</h3><ul><li>Пароли: вход происходит на страницах Microsoft или Ely.by.</li><li>Токены Minecraft, Xbox и XSTS: они остаются на вашем устройстве.</li></ul><h3>Зачем</h3><p>Чтобы определить ваш SA-профиль и синхронизировать настройки и сборки между устройствами.</p><h3>Третьи стороны</h3><p>Microsoft и Ely.by (вход) и Modrinth (каталог модов) обрабатывают данные по своим правилам. Мы не используем рекламу и слежку.</p><h3>Ваши права</h3><p>Вы можете в любой момент получить, исправить или удалить свои данные и аккаунт SA (GDPR). Пишите на ${MAIL}.</p></div>`},
pl:{a:`<div class='card doc'><h2>O SA Launcher</h2><p>SA Launcher to niezależny launcher do Minecraft: Java Edition, stworzony przez Simeona Alyusheva (Polska). Nie jest oficjalnym produktem Minecraft ani nie jest zatwierdzony przez Mojang lub Microsoft, ani z nimi powiązany.</p><h3>Co robi</h3><ul><li>Pobiera pliki gry bezpośrednio z oficjalnych serwerów Mojang i nigdy ich nie rozpowszechnia.</li><li>Loguje graczy z licencją przez Microsoft i sprawdza posiadanie Java Edition.</li><li>Oferuje Ely.by jako osobną, wyraźnie oznaczoną opcję dla graczy bez licencji.</li><li>Zarządza instancjami i instaluje mody, shadery i paczki z Modrinth.</li><li>Przechowuje tokeny Minecraft wyłącznie na urządzeniu gracza.</li></ul><h3>Uprawnienia Microsoft</h3><p>Tylko XboxLive.signin i offline_access, wyłącznie do logowania i wczytania profilu Minecraft.</p><h3>Kontakt</h3><p>${MAIL}</p></div>`,

async function getJ(u,k){let e;for(let i=0;i<3;i++){try{const c=new AbortController(),t=setTimeout(()=>c.abort(),9000);const r=await fetch(u,{signal:c.signal});clearTimeout(t);let d;try{d=await r.json()}catch(_){throw new Error("HTTP "+r.status)}if(!r.ok)throw new Error(d.error||"HTTP "+r.status);try{localStorage.setItem("c:"+k,JSON.stringify(d))}catch(_){}return d}catch(x){e=x;await new Promise(r=>setTimeout(r,500*(i+1)))}}
 const c=ca(k);if(c)return c;throw e}

 if(c&&c.results)draw(c.results);else $("#res").textContent="…";
 try{const d=await api(u);if(my!==SEQ)return;draw(d.results||[])}
 catch(e){if(my!==SEQ)return;if(!(c&&c.results)){$("#res").innerHTML='<div class="card" style="grid-column:1/-1">'+esc(e.message)+' <button class="btn s" id="rt" style="padding:6px 16px;margin-left:8px">↻</button></div>';$("#rt").onclick=go}}}

function vlist(){const mc=$("#vm").value,ld=$("#vl").value;
 const ok=v=>(!mc||!(v.mc||[]).length||v.mc.includes(mc))&&(!ld||!(v.loaders||[]).length||v.loaders.includes(ld));
 const rows=VS.map(v=>({v,ok:ok(v)}));rows.sort((a,b)=>b.ok-a.ok);
 $("#vs").innerHTML=rows.map(({v,ok})=>'<div class="vr'+(ok?"":" off")+'"><div><b>'+esc(v.name)+"</b><br><small>"+esc((v.mc||[]).slice(0,6).join(", "))+" · "+esc((v.loaders||[]).join(", "))+"</small></div>"+
 (!ok?'<span class="btn s" style="padding:8px 18px">'+tx("no")+"</span>":v.url?'<a class="btn p" style="padding:8px 18px" href="'+esc(v.url)+'">'+tx("dl")+"</a>":'<a class="btn s" style="padding:8px 18px" target="_blank" rel="noopener" href="'+esc(CUR.url)+'">'+tx("page")+"</a>")+"</div>").join("")||tx("none")}
async function show(x){CUR=x;$("#md").classList.remove("hide");$("#mb").innerHTML='<div style="display:flex;gap:14px;align-items:center"><img class="mi" src="'+esc(x.icon||"")+'" alt=""><div><h2 style="margin:0">'+esc(x.title)+"</h2><small>"+esc(x.desc)+'</small></div></div><p><a href="'+esc(x.url)+'" target="_blank" rel="noopener">'+(x.src==="curseforge"?"CurseForge":"Modrinth")+' ↗</a></p><div id="vs">…</div>';
try{const d=await api("/api/versions?"+new URLSearchParams({src:x.src,id:x.id}));VS=d.versions||[];
 const mcs=[...new Set(VS.flatMap(v=>v.mc||[]))].sort(vcmp),lds=[...new Set(VS.flatMap(v=>v.loaders||[]))];
 const pm=$("#ver").value,pl=$("#ldr").value;
 $("#vs").insertAdjacentHTML("beforebegin",'<div class="sel"><div class="pill"><select id="vm"><option value="">'+tx("mc")+": "+tx("any")+"</option>"+mcs.map(m=>'<option'+(m===pm?" selected":"")+">"+esc(m)+"</option>").join("")+'</select></div><div class="pill"><select id="vl"><option value="">'+tx("ld")+": "+tx("any")+"</option>"+lds.map(m=>'<option'+(m===pl?" selected":"")+">"+esc(m)+"</option>").join("")+"</select></div></div>");
 $("#vm").onchange=$("#vl").onchange=vlist;vlist()}catch(e){$("#vs").textContent=e.message}}
